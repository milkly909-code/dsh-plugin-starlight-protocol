name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  manifest:
    name: Manifest & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/splash.js
      - name: Manifest validation
        run: node test/manifest.mjs

  boot-safety:
    name: Boot safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Apply must never throw
        run: node test/boot-safety.mjs
      - name: Kernel compatibility (rc.5 behaviours)
        run: node test/rc5-compat.mjs
